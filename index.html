<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title">ROXSAN 6+2</title>
  <meta name="description" content="ROXSAN by RMA 6+2 electric golf cart" data-i18n-content="meta.desc">
  <meta name="theme-color" content="#0B2A5B">
  <meta property="og:title" content="ROXSAN 6+2 — 8-seat electric golf cart">
  <meta property="og:image" content="assets/hero.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2A5B'/%3E%3Cpath d='M9 22V10h8a4 4 0 010 8h-8m6 0l6 4' fill='none' stroke='%236EC1F5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p class="noscript">กรุณาเปิดใช้งาน JavaScript / Please enable JavaScript.</p></noscript>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#hero" aria-label="ROXSAN by RMA">
        <span class="brand-name">ROXSAN</span>
        <span class="brand-by" data-i18n="brand.by">by RMA</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#gallery" data-i18n="nav.gallery"></a>
        <a href="#colors" data-i18n="nav.colors"></a>
        <a href="#why" data-i18n="nav.why"></a>
        <a href="#screen" data-i18n="nav.screen"></a>
        <a href="#specs" data-i18n="nav.specs"></a>
        <a href="#accessories" data-i18n="nav.accessories"></a>
        <a href="#warranty" data-i18n="nav.warranty"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-btn" id="langBtn" type="button" data-i18n="lang.short" data-i18n-aria-label="lang.label"></button>
        <a class="btn btn-primary btn-sm" href="#quote" data-i18n="nav.quote"></a>
      </div>
    </div>
  </header>

  <main>
    <section id="hero" class="hero">
      <div class="wrap hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n="hero.sub"></p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="#quote" data-i18n="hero.cta1"></a>
            <a class="btn btn-ghost" href="#specs" data-i18n="hero.cta2"></a>
            <a class="btn btn-ghost pdf-btn" href="#" download data-pdf-th="pdf/ROXSAN-6plus2-catalog-th.pdf" data-pdf-en="pdf/ROXSAN-6plus2-catalog-en.pdf" data-i18n="pdf.btn"></a>
          </div>
        </div>
        <div class="hero-media">
          <img src="assets/hero.jpg" alt="" data-i18n-alt="hero.imgalt" width="1600" height="1200" fetchpriority="high">
        </div>
      </div>
    </section>

    <section id="facts" class="facts" aria-label="Key facts">
      <div class="wrap facts-grid">
        <div class="fact"><strong data-i18n="facts.seats.v"></strong><span data-i18n="facts.seats.l"></span></div>
        <div class="fact"><strong data-i18n="facts.motor.v"></strong><span data-i18n="facts.motor.l"></span></div>
        <div class="fact"><strong data-i18n="facts.charge.v"></strong><span data-i18n="facts.charge.l"></span></div>
        <div class="fact"><strong data-i18n="facts.warranty.v"></strong><span data-i18n="facts.warranty.l"></span></div>
      </div>
    </section>

    <section id="gallery" class="section">
      <div class="wrap">
        <p class="eyebrow" data-i18n="gallery.eyebrow"></p>
        <h2 data-i18n="gallery.title"></h2>
        <div class="gallery reveal">
          <button type="button" class="g-item g-1" data-index="0"><img src="assets/hero.jpg" alt="" data-i18n-alt="gallery.1.alt" loading="lazy"></button>
          <button type="button" class="g-item g-2" data-index="1"><img src="assets/rear-resort.jpg" alt="" data-i18n-alt="gallery.2.alt" loading="lazy"></button>
          <button type="button" class="g-item g-3" data-index="2"><img src="assets/front-resort.jpg" alt="" data-i18n-alt="gallery.3.alt" loading="lazy"></button>
          <button type="button" class="g-item g-4" data-index="3"><img src="assets/factory-1.jpg" alt="" data-i18n-alt="gallery.4.alt" loading="lazy"></button>
          <button type="button" class="g-item g-5" data-index="4"><img src="assets/factory-2.jpg" alt="" data-i18n-alt="gallery.5.alt" loading="lazy"></button>
        </div>
        <p class="note" data-i18n="gallery.note"></p>
      </div>
    </section>

    <section id="colors" class="section alt">
      <div class="wrap">
        <p class="eyebrow" data-i18n="colors.eyebrow"></p>
        <h2 data-i18n="colors.title"></h2>
        <p class="lead" data-i18n="colors.sub"></p>
        <div class="colors reveal">
          <div class="color-preview">
            <div class="color-chip" id="colorChip"><span class="chip-code"></span><span class="chip-name"></span></div>
          </div>
          <div class="color-panel">
            <p class="color-name" id="colorName" aria-live="polite"></p>
            <div class="swatches" id="swatches" role="radiogroup" data-i18n-aria-label="colors.group"></div>
            <p class="note" data-i18n="colors.note"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="why" class="section">
      <div class="wrap">
        <p class="eyebrow" data-i18n="why.eyebrow"></p>
        <h2 data-i18n="why.title"></h2>
        <div class="cards reveal">
          <article class="card"><h3 data-i18n="why.1.t"></h3><p data-i18n="why.1.d"></p></article>
          <article class="card"><h3 data-i18n="why.2.t"></h3><p data-i18n="why.2.d"></p></article>
          <article class="card"><h3 data-i18n="why.3.t"></h3><p data-i18n="why.3.d"></p></article>
          <article class="card"><h3 data-i18n="why.4.t"></h3><p data-i18n="why.4.d"></p></article>
          <article class="card"><h3 data-i18n="why.5.t"></h3><p data-i18n="why.5.d"></p></article>
        </div>
      </div>
    </section>

    <section id="screen" class="section navy">
      <div class="wrap screen-grid reveal">
        <div>
          <p class="eyebrow" data-i18n="screen.eyebrow"></p>
          <h2 data-i18n="screen.title"></h2>
          <p class="lead on-dark" data-i18n="screen.sub"></p>
          <p class="note on-dark" data-i18n="screen.note"></p>
        </div>
        <img class="screen-img" src="assets/screen.jpg" alt="" data-i18n-alt="screen.alt" width="1200" height="900" loading="lazy">
      </div>
    </section>

    <section id="specs" class="section alt">
      <div class="wrap">
        <p class="eyebrow" data-i18n="specs.eyebrow"></p>
        <h2 data-i18n="specs.title"></h2>
        <div id="specList" class="spec-list reveal"></div>
        <p class="note" data-i18n="specs.note"></p>
      </div>
    </section>

    <section id="accessories" class="section">
      <div class="wrap">
        <p class="eyebrow" data-i18n="acc.eyebrow"></p>
        <h2 data-i18n="acc.title"></h2>
        <p class="lead" data-i18n="acc.sub"></p>
        <ul id="accList" class="acc-list reveal"></ul>
      </div>
    </section>

    <section id="warranty" class="section navy">
      <div class="wrap">
        <p class="eyebrow" data-i18n="warranty.eyebrow"></p>
        <h2 data-i18n="warranty.title"></h2>
        <div class="warranty-grid reveal">
          <div class="w-item"><strong data-i18n="warranty.1.v"></strong><span data-i18n="warranty.1.l"></span></div>
          <div class="w-item"><strong data-i18n="warranty.2.v"></strong><span data-i18n="warranty.2.l"></span></div>
          <div class="w-item"><strong data-i18n="warranty.3.v"></strong><span data-i18n="warranty.3.l"></span></div>
        </div>
        <p class="note on-dark" data-i18n="warranty.note"></p>
      </div>
    </section>

    <section id="quote" class="section">
      <div class="wrap quote-grid">
        <div>
          <p class="eyebrow" data-i18n="quote.eyebrow"></p>
          <h2 data-i18n="quote.title"></h2>
          <p class="lead" data-i18n="quote.sub"></p>
          <div class="contact-btns">
            <a class="btn btn-line" id="lineLink" href="#" target="_blank" rel="noopener" data-i18n="quote.line"></a>
            <a class="btn btn-ghost" id="phoneLink" href="#" data-i18n="quote.phone"></a>
            <a class="btn btn-ghost" id="waLink" href="#" target="_blank" rel="noopener" data-i18n="quote.wa"></a>
            <a class="btn btn-ghost" id="fbLink" href="#" target="_blank" rel="noopener" data-i18n="quote.fb"></a>
          </div>
          <p class="contact-values" id="contactValues"></p>
        </div>
        <form id="quoteForm" class="form" novalidate>
          <label><span data-i18n="form.name"></span><input name="name" autocomplete="name" required></label>
          <label><span data-i18n="form.phone"></span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
          <label><span data-i18n="form.resort"></span><input name="resort" autocomplete="organization"></label>
          <div class="form-row">
            <label><span data-i18n="form.qty"></span><input name="qty" type="number" min="1" inputmode="numeric"></label>
            <label><span data-i18n="form.color"></span>
              <select name="color" id="formColor"></select>
            </label>
          </div>
          <label><span data-i18n="form.note"></span><textarea name="note" rows="3"></textarea></label>
          <p class="form-err" id="formErr" role="alert" hidden data-i18n="form.err"></p>
          <p class="form-ok" id="formOk" role="status" hidden data-i18n="form.copied"></p>
          <div class="form-actions">
            <button class="btn btn-line" type="submit" data-channel="line" data-i18n="form.sendLine"></button>
            <button class="btn btn-primary" type="submit" data-channel="wa" data-i18n="form.sendWa"></button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div>
        <span class="brand-name">ROXSAN</span> <span class="brand-by" data-i18n="brand.by"></span>
      </div>
      <p data-i18n="footer.seller"></p>
      <p data-i18n="footer.brand"></p>
      <p><a id="siteLink" href="#" target="_blank" rel="noopener"></a></p>
      <p><a class="pdf-btn" href="#" download data-pdf-th="pdf/ROXSAN-6plus2-catalog-th.pdf" data-pdf-en="pdf/ROXSAN-6plus2-catalog-en.pdf" data-i18n="pdf.btn"></a></p>
      <p><a href="2plus2.html" data-i18n="footer.other"></a></p>
    </div>
  </footer>

  <a class="sticky-cta" href="#quote" data-i18n="sticky.cta"></a>

  <dialog id="lightbox" class="lightbox" aria-label="Gallery">
    <button type="button" class="lb-btn lb-close" id="lbClose" data-i18n-aria-label="lb.close">&times;</button>
    <button type="button" class="lb-btn lb-prev" id="lbPrev" data-i18n-aria-label="lb.prev">&#8249;</button>
    <img id="lbImg" alt="">
    <button type="button" class="lb-btn lb-next" id="lbNext" data-i18n-aria-label="lb.next">&#8250;</button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/specs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
